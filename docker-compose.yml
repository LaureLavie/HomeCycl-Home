version: '3.8'

services:
  front:
    image: lorlaviedevdesign/front:latest
    container_name: homecyclhome_frontend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    depends_on:
      - back
    networks:
      - app-network

  back:
    image: lorlaviedevdesign/back:latest
    container_name: homecyclhome_backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - ./uploads:/app/uploads
    networks:
      - app-network

networks:
  app-network:
    driver: bridge