name: 🚴 HomeCycl'Home — CI/CD Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FRONT_IMAGE: lorlaviedevdesign/front
  BACK_IMAGE: lorlaviedevdesign/back
  DOCKER_TAG: ${{ github.sha }}

jobs:
  build:
    name: 🐳 Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🗂️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- 1. BUILD & PUSH FRONTEND (NEXTJS) ---
      - name: 🏗️ Build & Push Frontend (Next.js)
        uses: docker/build-push-action@v5
        with:
          context: ./nextjs
          file: ./nextjs/Dockerfile
          push: true
          tags: |
            ${{ env.FRONT_IMAGE }}:${{ env.DOCKER_TAG }}
            ${{ env.FRONT_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- 2. BUILD & PUSH BACKEND (NODEJS) ---
      - name: 🏗️ Build & Push Backend (Node.js)
        uses: docker/build-push-action@v5
        with:
          context: ./nodejs
          file: ./nodejs/Dockerfile
          push: true
          tags: |
            ${{ env.BACK_IMAGE }}:${{ env.DOCKER_TAG }}
            ${{ env.BACK_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 🚀 Deploy sur VPS OVH
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: 📡 Connexion SSH et déploiement
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            # 1. Aller dans le dossier contenant le docker-compose.yml
            cd /home/ubuntu/homecyclhome/
            
            # 2. Login Docker Hub pour pouvoir pull
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # 3. Force le pull des nouvelles images versionnées
            docker pull ${{ env.FRONT_IMAGE }}:${{ env.DOCKER_TAG }}
            docker pull ${{ env.BACK_IMAGE }}:${{ env.DOCKER_TAG }}
            
            # 4. Redéploiement avec docker-compose
            docker-compose pull
            docker-compose up -d

            # 5. Nettoyage des anciennes images inutilisées
            docker image prune -f
            echo "✅ Déploiement du Front et du Back terminé avec succès !"